name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to the same version as requirements-dev.txt, so a new ruff release
      # cannot fail a commit that passed locally.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.8"
          args: check
          src: "./custom_components ./tests"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.8"
          args: format --check
          src: "./custom_components ./tests"

  mypy:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: mypy custom_components/confident_assist

  pytest:
    name: pytest (Home Assistant 2026.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: >-
          pytest --cov=custom_components.confident_assist
          --cov-report=term-missing --cov-fail-under=100
